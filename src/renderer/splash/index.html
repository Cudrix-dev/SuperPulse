<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>SuperPulse</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="splash.css" />
    <script type="module" src="splash.js"></script>
  </head>
  <body>
    <!-- Tint + ambient light layered over the native Acrylic backdrop -->
    <div class="backdrop" aria-hidden="true">
      <div class="backdrop__ambient"></div>
      <div class="backdrop__noise"></div>
      <div class="backdrop__highlight"></div>
    </div>

    <main class="stage">
      <div class="emblem" aria-hidden="true">
        <span class="emblem__glow"></span>
        <span class="emblem__ripple"></span>
        <span class="emblem__ripple emblem__ripple--late"></span>

        <svg class="emblem__icon" viewBox="0 0 64 64" width="72" height="72">
          <defs>
            <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6ad3ff" />
              <stop offset="1" stop-color="#8b74ff" />
            </linearGradient>
            <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.35" />
              <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#tile)" />
          <rect x="2.5" y="2.5" width="59" height="59" rx="17.5" fill="url(#sheen)" stroke="#ffffff" stroke-opacity="0.28" />
          <path
            class="emblem__trace"
            d="M12 34 H22 L26.5 23 L32.5 45 L37.5 28 L40.5 34 H52"
            pathLength="100"
            fill="none"
            stroke="#ffffff"
            stroke-width="4.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <h1 class="title"><span>Super</span><span class="title__accent">Pulse</span></h1>
      <p class="tagline">Real-time hardware monitor</p>
      <div class="loader" aria-hidden="true"></div>
    </main>

    <footer class="credit">
      Developed by <strong>Cudrix</strong><span class="credit__version" id="version"></span>
    </footer>
  </body>
</html>
